name: Deploy PixelCraft POS to Namecheap (pos.pixelcraftlk.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static Next.js app
        env:
          NEXT_PUBLIC_SITE_URL: 'https://pos.pixelcraftlk.com'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          pnpm --filter @pixelcraft/types build
          pnpm --filter @pixelcraft/web build

      - name: Deploy build output to Namecheap cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./apps/web/out/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            maintenance.flag

      - name: Verify Live Endpoints
        run: |
          echo "Waiting 5 seconds for web server and edge caches to update..."
          sleep 5

          echo "Verifying live endpoints on pos.pixelcraftlk.com via HTTPS..."
          PASSED=false
          for i in {1..8}; do
            TS=$(date +%s)
            ROOT_CODE=$(curl -sL -o /dev/null -w "%{http_code}" "https://pos.pixelcraftlk.com/?v=$TS")
            POS_RES=$(curl -sL -w "\n%{http_code}" "https://pos.pixelcraftlk.com/dashboard/pos/?v=$TS")
            POS_CODE=$(echo "$POS_RES" | tail -n 1)

            echo "Attempt $i: Root HTTP $ROOT_CODE, POS HTTP $POS_CODE"

            if [ "$ROOT_CODE" = "200" ] && [ "$POS_CODE" = "200" ]; then
              PASSED=true
              echo "✓ Both Root and POS endpoints responded with HTTP 200."
              break
            fi
            sleep 4
          done

          if [ "$PASSED" != "true" ]; then
            echo "ERROR: Live health check failed (Root: $ROOT_CODE, POS: $POS_CODE)"
            exit 1
          fi

          echo "=========================================================="
          echo "✓ PixelCraft POS is LIVE and HEALTHY at https://pos.pixelcraftlk.com"
          echo "=========================================================="
