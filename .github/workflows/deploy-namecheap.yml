name: Deploy PixelCraft POS to Namecheap (pos.pixelcraftlk.com)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Deployment Action'
        required: false
        default: 'deploy'
        type: choice
        options:
          - 'deploy'
          - 'disable-maintenance-only'
          - 'enable-maintenance-only'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        if: "${{ github.event.inputs.action != 'disable-maintenance-only' && github.event.inputs.action != 'enable-maintenance-only' }}"
        run: pnpm install --frozen-lockfile

      - name: Build static Next.js app
        if: "${{ github.event.inputs.action != 'disable-maintenance-only' && github.event.inputs.action != 'enable-maintenance-only' }}"
        env:
          NEXT_PUBLIC_SITE_URL: 'https://pos.pixelcraftlk.com'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          pnpm --filter @pixelcraft/types build
          pnpm --filter @pixelcraft/web build

      - name: Stage 1 — Enable Maintenance Mode via curl
        if: "${{ github.event.inputs.action != 'disable-maintenance-only' }}"
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          SERVER_HOST="${FTP_SERVER#ftp://}"
          SERVER_HOST="${SERVER_HOST%/}"

          echo "DEPLOY_ACTIVE_$(date -u +%Y%m%d_%H%M%S)" > ./maintenance.flag

          echo "Uploading maintenance assets and flag via FTPS curl (non-destructive)..."
          curl --ssl-reqd --ftp-pasv -k -s -S -u "${FTP_USERNAME}:${FTP_PASSWORD}" -T apps/web/public/.htaccess "ftp://${SERVER_HOST}/.htaccess"
          curl --ssl-reqd --ftp-pasv -k -s -S -u "${FTP_USERNAME}:${FTP_PASSWORD}" -T apps/web/public/maintenance.html "ftp://${SERVER_HOST}/maintenance.html"
          curl --ssl-reqd --ftp-pasv -k -s -S -u "${FTP_USERNAME}:${FTP_PASSWORD}" -T ./maintenance.flag "ftp://${SERVER_HOST}/maintenance.flag"
          echo "✓ Maintenance Mode is active."

      - name: Stage 2 — Clear Remote Sync State
        if: "${{ github.event.inputs.action != 'disable-maintenance-only' && github.event.inputs.action != 'enable-maintenance-only' }}"
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          SERVER_HOST="${FTP_SERVER#ftp://}"
          SERVER_HOST="${SERVER_HOST%/}"

          echo "Deleting any corrupted .ftp-deploy-sync-state.json from remote root..."
          curl --ssl-reqd --ftp-pasv -k -s -S -u "${FTP_USERNAME}:${FTP_PASSWORD}" "ftp://${SERVER_HOST}/" -Q "-DELE .ftp-deploy-sync-state.json" -o /dev/null || true
          echo "✓ Remote sync state cleared for clean full sync."

      - name: Stage 2 — Full Static Site Sync (apps/web/out/)
        if: "${{ github.event.inputs.action != 'disable-maintenance-only' && github.event.inputs.action != 'enable-maintenance-only' }}"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./apps/web/out/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            maintenance.flag

      - name: Stage 3 — Disable Maintenance Mode & Verify Live Site
        if: "always() && github.event.inputs.action != 'enable-maintenance-only'"
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          SERVER_HOST="${FTP_SERVER#ftp://}"
          SERVER_HOST="${SERVER_HOST%/}"

          echo "Deleting maintenance.flag from remote root via FTPS curl..."
          curl --ssl-reqd --ftp-pasv -k -s -S -u "${FTP_USERNAME}:${FTP_PASSWORD}" "ftp://${SERVER_HOST}/" -Q "-DELE maintenance.flag" -o /dev/null || true
          echo "✓ Deleted maintenance.flag."

          echo "Waiting 5 seconds for web server and edge caches to update..."
          sleep 5

          echo "Verifying live endpoints on pos.pixelcraftlk.com..."
          TS=$(date +%s)
          FLAG_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pos.pixelcraftlk.com/maintenance.flag?t=$TS")
          echo "maintenance.flag check: HTTP $FLAG_STATUS (expected 404)"

          PASSED=false
          for i in {1..6}; do
            TS=$(date +%s)
            ROOT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pos.pixelcraftlk.com/?t=$TS")
            LOGIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pos.pixelcraftlk.com/login/?t=$TS")
            echo "Attempt $i: Root: $ROOT_STATUS, Login: $LOGIN_STATUS"

            if [ "$ROOT_STATUS" = "200" ] && [ "$LOGIN_STATUS" = "200" ]; then
              PASSED=true
              break
            fi
            sleep 3
          done

          if [ "$PASSED" != "true" ]; then
            echo "ERROR: Live health check failed after multiple attempts (Root: $ROOT_STATUS, Login: $LOGIN_STATUS)"
            exit 1
          fi

          echo "=========================================================="
          echo "✓ PixelCraft POS is LIVE and HEALTHY at https://pos.pixelcraftlk.com"
          echo "=========================================================="
