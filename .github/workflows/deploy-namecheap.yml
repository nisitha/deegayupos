name: Deploy PixelCraft POS to Namecheap (pos.pixelcraftlk.com)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Deployment Action'
        required: false
        default: 'deploy'
        type: choice
        options:
          - 'deploy'
          - 'disable-maintenance-only'
          - 'enable-maintenance-only'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        if: "${{ github.event.inputs.action != 'disable-maintenance-only' && github.event.inputs.action != 'enable-maintenance-only' }}"
        run: pnpm install --frozen-lockfile

      - name: Build static Next.js app
        if: "${{ github.event.inputs.action != 'disable-maintenance-only' && github.event.inputs.action != 'enable-maintenance-only' }}"
        env:
          NEXT_PUBLIC_SITE_URL: 'https://pos.pixelcraftlk.com'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          pnpm --filter @pixelcraft/types build
          pnpm --filter @pixelcraft/web build

      - name: Prepare Maintenance Mode Assets
        if: "${{ github.event.inputs.action != 'disable-maintenance-only' }}"
        run: |
          mkdir -p ./deploy-maint
          cp apps/web/public/.htaccess ./deploy-maint/
          cp apps/web/public/maintenance.html ./deploy-maint/
          echo "DEPLOY_ACTIVE_$(date -u +%Y%m%d_%H%M%S)" > ./deploy-maint/maintenance.flag

      - name: Stage 1 — Enable Maintenance Mode (< 3s)
        if: "${{ github.event.inputs.action != 'disable-maintenance-only' }}"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-maint/
          server-dir: ./
          dangerous-clean-slate: false

      - name: Stage 2 — Main Static Export Sync
        if: "${{ github.event.inputs.action != 'disable-maintenance-only' && github.event.inputs.action != 'enable-maintenance-only' }}"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./apps/web/out/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/maintenance.flag

      - name: Stage 3 — Disable Maintenance Mode
        if: "${{ github.event.inputs.action != 'enable-maintenance-only' }}"
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import subprocess
          from ftplib import FTP_TLS

          server = os.environ.get('FTP_SERVER', '').strip()
          username = os.environ.get('FTP_USERNAME', '').strip()
          password = os.environ.get('FTP_PASSWORD', '').strip()

          if not server or not username:
              print("Notice: FTP credentials missing, skipping maintenance flag deletion.")
              sys.exit(0)

          deleted = False

          # 1. Attempt FTPS deletion via Python ftplib
          try:
              print(f"Connecting to {server} via FTPS...")
              ftps = FTP_TLS()
              ftps.connect(server, 21, timeout=30)
              ftps.login(username, password)
              ftps.prot_p()
              try:
                  ftps.delete('maintenance.flag')
                  print("✓ Successfully deleted maintenance.flag from server root. Maintenance Mode is OFF.")
                  deleted = True
              except Exception as del_err:
                  print(f"File delete note (file may already be deleted): {del_err}")
                  deleted = True
              finally:
                  try:
                      ftps.quit()
                  except Exception:
                      ftps.close()
          except Exception as conn_err:
              print(f"FTPS connection error via Python: {conn_err}")

          # 2. Fallback to curl --ftp-ssl
          if not deleted:
              print("Attempting remote delete via curl --ftp-ssl fallback...")
              cmd = [
                  "curl", "--ftp-ssl", "--insecure", "-s", "-S",
                  "-u", f"{username}:{password}",
                  f"ftp://{server}/",
                  "-Q", "DELE maintenance.flag"
              ]
              res = subprocess.run(cmd, capture_output=True, text=True)
              print("curl stdout:", res.stdout)
              print("curl stderr:", res.stderr)
              if res.returncode == 0:
                  print("✓ Successfully deleted maintenance.flag via curl fallback. Maintenance Mode is OFF.")
                  deleted = True

          if deleted:
              print("==================================================")
              print("✓ DEPLOYMENT COMPLETE: PixelCraft POS is LIVE at pos.pixelcraftlk.com")
              print("==================================================")
          EOF
